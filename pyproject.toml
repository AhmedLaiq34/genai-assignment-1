[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genai"
version = "0.0.1"
description = "Generative AI Assignment #1: restoration AEs, hard/soft routing, style-conditioned cGAN"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "pillow>=10", "pyyaml>=6", "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
